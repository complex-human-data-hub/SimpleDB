[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chdh-simpledb"
version = "1.0.0"
description = "AWS SimpleDB convenience wrapper used by Complex Human Data Hub projects"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Ben Stone", email = "benjamin.stone@gmail.com" },
]
dependencies = [
    "boto3>=1.20",
    "future",
]

[project.urls]
Repository = "https://github.com/bens/simpledb"

[tool.setuptools]
py-modules = ["simpledb"]
